<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Proxy</title>
		<script src="/baremux/index.js"></script>
		<script src="/register-sw.js"></script>
	</head>
	<body>
		<script>
			// Isolation mode: the shell keeps this hidden frame open on a site's
			// origin. It registers the proxy service worker there and holds the
			// site's proxy connection (bare-mux worker + transport), so the
			// connection survives the site's own pages navigating and the
			// service worker always has a page to ask for it.
			// Pass the service worker's blocked-request counts on to the shell
			// (new tab stats).
			navigator.serviceWorker.addEventListener("message", (event) => {
				if (event.data?.bios === "blocked")
					parent.postMessage({ bios: "blocked", count: event.data.count, hosts: event.data.hosts }, "*");
			});
			navigator.serviceWorker.startMessages();

			// A page of this site without the page script (a JSON file, an
			// image, a PDF, a warning page) can't tell the shell where its tab
			// is, and the shell can't read another origin's address. This frame
			// can: it shares the origin. Reading throws for other sites' frames.
			//
			// The shell doesn't take this frame's word for it: a page of this
			// site could reach in here and name any tab. It sends a one-time
			// word to the tab's own frame, in a message the browser delivers only
			// if that frame is on this origin, and the word comes back with the
			// address. So nothing on this origin can speak for another site's tab.
			setInterval(() => {
				const docs = [];
				for (let index = 0; index < parent.length; index++) {
					try {
						const win = parent[index];
						const href = win.location.href;
						if (win === window || win.__biosShield) continue;
						if (!win.__biosWhere) {
							// on the page's window, so it goes when the page does
							win.__biosWhere = true;
							win.addEventListener("message", (event) => {
								if (event.source !== parent || event.data?.bios !== "where") return;
								parent.postMessage({ bios: "docs", word: event.data.word, href: win.location.href }, "*");
							});
						}
						// `name` lets the shell notice that the frames moved in between
						docs.push({ index, name: win.name, href });
					} catch {
						// another site's frame
					}
				}
				if (docs.length) parent.postMessage({ bios: "docs", docs }, "*");
			}, 500);

			registerSW()
				.then(setupTransport)
				.then(
					() => parent.postMessage({ bios: "anchor-ready" }, "*"),
					(err) =>
						parent.postMessage(
							{ bios: "anchor-ready", error: String(err && err.message) },
							"*"
						)
				);
		</script>
	</body>
</html>
