name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm -C app install --frozen-lockfile
      - run: pnpm -C app lint
      - run: pnpm -C app test
      - run: pnpm -C app audit --prod --audit-level high
      - run: docker build -t browser-ios .
      # desktop app: its rules and a syntax check (no Electron binary needed)
      - run: pnpm -C desktop install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm -C desktop test
      - run: node --check desktop/main.js && node --check desktop/ui/ui.js
      - run: pnpm -C desktop audit --prod --audit-level high
